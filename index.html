<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advocate & Clerk Directory</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #1a73e8;
      --border-color: #dddddd;
    }
    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --border-color: #333333;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    header {
      background: var(--primary-color);
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .container {
      padding: 15px;
      max-width: 800px;
      margin: auto;
    }
    .search-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      box-sizing: border-box;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #e0e0e0;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }
    .tab-btn.active {
      background: var(--primary-color);
      color: white;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    .card h3 { margin: 0 0 5px 0; }
    .card p { margin: 3px 0; font-size: 14px; }
    .actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 6px 12px;
      text-decoration: none;
      color: white;
      border-radius: 4px;
      font-size: 13px;
    }
    .btn-call { background: #28a745; }
    .btn-wa { background: #25d366; }
    .theme-btn {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
    }
    #admin-panel { display: none; }
  </style>
</head>
<body>

  <header>
    <h2 id="logo" style="margin:0; cursor:pointer;">Directory App</h2>
    <button class="theme-btn" onclick="toggleTheme()">Theme</button>
  </header>

  <div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="Naam, Code ya Mobile se search karein..." onkeyup="filterData()">

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('advocates')">Advocates</button>
      <button class="tab-btn" onclick="switchTab('clerks')">Clerks</button>
    </div>

    <div id="advocates-list"></div>
    <div id="clerks-list" style="display:none;"></div>

    <div id="admin-panel" class="card">
      <h3>Admin Panel</h3>
      <p>Aap successfull admin mode me login ho chuke hain.</p>
    </div>
  </div>

  <script>
    // Sample Data Source
    const database = {
      advocates: [
        { id: 1, name: "A K SHARMA", code: "1001", mobile: "9876543210", clerk: "Ramesh" },
        { id: 2, name: "S S TRIVEDI", code: "1234", mobile: "9123456789", clerk: "Suresh" }
      ],
      clerks: [
        { id: 1, name: "Ramesh", mobile: "9800000000" },
        { id: 2, name: "Suresh", mobile: "9700000000" }
      ]
    };

    let currentTab = 'advocates';
    let tapCount = 0;

    // Render Data
    function render() {
      const advContainer = document.getElementById('advocates-list');
      const clerkContainer = document.getElementById('clerks-list');

      advContainer.innerHTML = database.advocates.map(adv => `
        <div class="card">
          <h3>${adv.name} (Code: ${adv.code})</h3>
          <p><strong>Mobile:</strong> ${adv.mobile || 'N/A'}</p>
          <p><strong>Clerk:</strong> ${adv.clerk || 'N/A'}</p>
          <div class="actions">
            ${adv.mobile ? `<a href="tel:${adv.mobile}" class="btn btn-call">Call</a>` : ''}
            ${adv.mobile ? `<a href="https://wa.me/91${adv.mobile}" target="_blank" class="btn btn-wa">WhatsApp</a>` : ''}
          </div>
        </div>
      `).join('');

      clerkContainer.innerHTML = database.clerks.map(clk => `
        <div class="card">
          <h3>${clk.name}</h3>
          <p><strong>Mobile:</strong> ${clk.mobile}</p>
          <div class="actions">
            <a href="tel:${clk.mobile}" class="btn btn-call">Call</a>
            <a href="https://wa.me/91${clk.mobile}" target="_blank" class="btn btn-wa">WhatsApp</a>
          </div>
        </div>
      `).join('');
    }

    // Switch Tabs
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      if (tab === 'advocates') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('advocates-list').style.display = 'block';
        document.getElementById('clerks-list').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('advocates-list').style.display = 'none';
        document.getElementById('clerks-list').style.display = 'block';
      }
      filterData();
    }

    // Search Filter Functionality
    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const activeList = currentTab === 'advocates' ? 'advocates-list' : 'clerks-list';
      const cards = document.getElementById(activeList).getElementsByClassName('card');

      Array.from(cards).forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(query) ? '' : 'none';
      });
    }

    // Dark Mode Toggle
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    // Secret Admin Panel Access (Triple Tap Header)
    document.getElementById('logo').addEventListener('click', () => {
      tapCount++;
      if (tapCount === 3) {
        const pin = prompt("Admin PIN Daalein:");
        if (pin === "1234") {
          document.getElementById('admin-panel').style.display = 'block';
          alert("Admin Access Granted!");
        } else {
          alert("Galat PIN!");
        }
        tapCount = 0;
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
